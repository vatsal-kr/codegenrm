# @package _global_

grpo_params:
    model_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    batch_size: 1
    gradient_accumulation_steps: 128

gen_params:
    vllm_gpu_memory_utilization: 0.7
    # TP=2 wedges on cn37: its NVSwitch is thermally degraded (SXid 10004,
    # 2026-07-08) and vllm TP collectives stall during cudagraph capture
    # (register_graph_buffers broadcast / cuda synchronize) even with all
    # multicast paths disabled. The 7B model fits on a single H100/H200 with
    # the 20k KV cache, so TP=1 avoids intra-vllm comms entirely and runs
    # stably. Retry TP=2 after the node is rebooted/serviced.
    vllm_tensor_parallel_size: 1